name: Publish Magisk versioned Release ZIP
on:
  push:
    branches: [main]
    paths: ['module.prop']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android NDK
        run: yes | sdkmanager --install "ndk;27.2.12479018"
      - name: Download JSON parser (MIT licensed)
        run: |
          set -euo pipefail
          mkdir -p .build/include/nlohmann
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp' -o .build/include/nlohmann/json.hpp
          test "$(wc -c < .build/include/nlohmann/json.hpp)" -gt 500000
      - name: Compile ARM64 vendor crypto adapter
        run: |
          set -euo pipefail
          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++"
          mkdir -p .build/bin
          "$CXX" -std=c++17 -O2 -Wall -Wextra -Werror -fPIE -pie -I.build/include src/baa_patch.cpp -ldl -o .build/bin/baa_patch
          file .build/bin/baa_patch
          sha256sum .build/bin/baa_patch
      - name: Validate and package pure Magisk module
        run: |
          set -euo pipefail
          for f in customize.sh post-fs-data.sh service.sh action.sh uninstall.sh; do bash -n "$f"; done
          VERSION="$(sed -n 's/^version=//p' module.prop)"
          test "$VERSION" = "1.4.0"
          mkdir -p dist/staging/bin
          cp module.prop customize.sh post-fs-data.sh service.sh action.sh uninstall.sh dist/staging/
          cp .build/bin/baa_patch dist/staging/bin/
          chmod 0755 dist/staging/{post-fs-data.sh,service.sh,action.sh,uninstall.sh,bin/baa_patch}
          FILE="HyperOS-Battery-Cycle-Index-Lock-v${VERSION}.zip"
          (cd dist/staging && zip -q -r -X "../$FILE" .)
          unzip -t "dist/$FILE"
          unzip -Z1 "dist/$FILE"
          if unzip -Z1 "dist/$FILE" | grep -Ei 'BAA_config|private/|stock.*json|\.enc$'; then
            echo 'Forbidden proprietary battery config embedded in ZIP'
            exit 1
          fi
          test "$(unzip -p "dist/$FILE" module.prop | grep -c '^version=1.4.0)" -eq 1
          sha256sum "dist/$FILE"
      - name: Tag and publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' module.prop)"
          TAG="v${VERSION}"
          ZIP="dist/HyperOS-Battery-Cycle-Index-Lock-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: will not overwrite a published binary."
            exit 1
          fi
          HASH="$(sha256sum "$ZIP" | awk '{print $1}')"
          BINHASH="$(sha256sum .build/bin/baa_patch | awk '{print $1}')"
          {
            echo "HyperOS 4 / Android 17. Xiaomi pudding OS4.0.4.0.XPCCNXM API37 only."
            echo
            echo "Install in Magisk; reboot. Installer generates encrypted BAA configs from the user's own exact-ROM OEM files, or carries forward a verified on-device v1.3.0 hotfix."
            echo "CN/GL index=1; LowSoh only cycle>=801 and raw SOH<=50. Stock charger voltage/current/temperature tables unchanged."
            echo
            echo "ZIP SHA256: $HASH"
            echo "BAA ARM64 helper SHA256: $BINHASH"
            echo
            echo "No OEM proprietary battery configuration is bundled. Invalid ROM/input/config fingerprints are rejected."
            echo "WARNING: fixed new-battery profile may accelerate wear over time. Disable module and reboot to restore stock."
          } > dist/RELEASE_NOTES.md
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "HyperOS Battery Cycle + SOH Index Lock $TAG" --notes-file dist/RELEASE_NOTES.md --prerelease
)" -eq 1
          sha256sum "dist/$FILE"
      - name: Tag and publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' module.prop)"
          TAG="v${VERSION}"
          ZIP="dist/HyperOS-Battery-Cycle-Index-Lock-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: will not overwrite a published binary."
            exit 1
          fi
          HASH="$(sha256sum "$ZIP" | awk '{print $1}')"
          BINHASH="$(sha256sum .build/bin/baa_patch | awk '{print $1}')"
          {
            echo "HyperOS 4 / Android 17. Xiaomi pudding OS4.0.4.0.XPCCNXM API37 only."
            echo
            echo "Install in Magisk; reboot. Installer generates encrypted BAA configs from the user's own exact-ROM OEM files, or carries forward a verified on-device v1.3.0 hotfix."
            echo "CN/GL index=1; LowSoh only cycle>=801 and raw SOH<=50. Stock charger voltage/current/temperature tables unchanged."
            echo
            echo "ZIP SHA256: $HASH"
            echo "BAA ARM64 helper SHA256: $BINHASH"
            echo
            echo "No OEM proprietary battery configuration is bundled. Invalid ROM/input/config fingerprints are rejected."
            echo "WARNING: fixed new-battery profile may accelerate wear over time. Disable module and reboot to restore stock."
          } > dist/RELEASE_NOTES.md
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "HyperOS Battery Cycle + SOH Index Lock $TAG" --notes-file dist/RELEASE_NOTES.md --prerelease
