name: Build and publish capability-detected battery module
on:
  push:
    branches: [main]
    paths: ['module.prop', 'customize.sh', 'post-fs-data.sh', 'service.sh', 'src/baa_patch.cpp', '.github/workflows/publish-magisk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android NDK
        run: yes | sdkmanager --install "ndk;27.2.12479018"
      - name: Download licensed nlohmann JSON header
        run: |
          set -euo pipefail
          mkdir -p .build/include/nlohmann
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp' -o .build/include/nlohmann/json.hpp
          test "$(wc -c < .build/include/nlohmann/json.hpp)" -gt 500000
      - name: Compile Android ARM64 native vendor crypto helper
        run: |
          set -euo pipefail
          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++"
          mkdir -p .build/bin
          "$CXX" -std=c++17 -O2 -Wall -Wextra -Werror -fPIE -pie -I.build/include src/baa_patch.cpp -ldl -o .build/bin/baa_patch
          file .build/bin/baa_patch
          sha256sum .build/bin/baa_patch
      - name: Shell static checks and Magisk ZIP creation
        run: |
          set -euo pipefail
          for f in customize.sh post-fs-data.sh service.sh action.sh uninstall.sh; do bash -n "$f"; done
          ! grep -E 'ro\.build\.version\.(incremental|sdk)' customize.sh post-fs-data.sh service.sh
          grep -q 'BAA_ENC' customize.sh
          grep -q 'P_SOURCE=' post-fs-data.sh
          grep -q 'crypto.decrypt' src/baa_patch.cpp
          VERSION="$(sed -n 's/^version=//p' module.prop)"
          test "$VERSION" = "1.4.0"
          mkdir -p dist/staging/bin
          cp module.prop customize.sh post-fs-data.sh service.sh action.sh uninstall.sh dist/staging/
          cp .build/bin/baa_patch dist/staging/bin/
          chmod 0755 dist/staging/post-fs-data.sh dist/staging/service.sh dist/staging/action.sh dist/staging/uninstall.sh dist/staging/bin/baa_patch
          FILE="HyperOS-Battery-Cycle-Index-Lock-v$VERSION.zip"
          (cd dist/staging && zip -qr -X "../$FILE" .)
          unzip -t "dist/$FILE"
          if unzip -Z1 "dist/$FILE" | grep -Ei 'BAA_config|private/|stock.*json|\.enc$'; then
            echo 'Refusing to redistribute proprietary OEM encrypted data'
            exit 1
          fi
          sha256sum "dist/$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: battery-capability-module
          path: dist/HyperOS-Battery-Cycle-Index-Lock-v*.zip
      - name: Publish new version
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' module.prop)"
          TAG="v$VERSION"
          ZIP="dist/HyperOS-Battery-Cycle-Index-Lock-v$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; retaining immutable artifact"
            exit 0
          fi
          HASH="$(sha256sum "$ZIP" | awk '{print $1}')"
          {
            echo "Compatibility is detected from the pudding hardware identity, real vendor BAA_ENC decoder ABI, OEM JSON schema, and BMS cycle/SOH nodes; no HyperOS build or SDK whitelist."
            echo "The original OEM ciphertext is never distributed. Only the target cycle map/LowSoh fields change."
            echo "Original OEM source SHA256 is pinned at install time and rechecked at boot; if firmware changes source data, the module skips safely until reinstalled."
            echo "Risk: keeping new-battery charging profile after aging can accelerate wear."
            echo "SHA256: $HASH"
          } > RELEASE_NOTES.md
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Battery Cycle & SOH Index Lock $TAG" --notes-file RELEASE_NOTES.md --prerelease
